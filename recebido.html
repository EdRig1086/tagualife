<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaguáLife · Recebimento / Entrada de Estoque</title>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="perfil.js"></script>
    <style>
        :root {
            --verde-claro: #C1CE83; --verde-oliva: #7A816E; --branco: #FBFBF7; --preto: #191D1B;
            --bg-body: #E8EBE0; --bg-card: #FBFBF7; --text-primary: #191D1B; --text-secondary: #7A816E;
            --border-color: #D8DCCE; --danger: #8B3A3A; --success: #2E7D32;
        }
        body.dark-mode {
            --bg-body: #1a1a1a; --bg-card: #2a2a2a; --text-primary: #e8e8e8;
            --text-secondary: #b0b8a8; --border-color: #444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Inter, sans-serif; background: var(--bg-body); color: var(--text-primary); min-height: 100vh; }
        .app-topbar {
            display: flex; align-items: center; gap: 1rem; padding: .6rem 1.2rem;
            background: var(--bg-card); border-bottom: 1px solid var(--border-color); flex-wrap: wrap;
        }
        .logo { font-weight: 800; text-decoration: none; color: var(--text-primary); }
        .logo span { color: var(--verde-oliva); }
        .nav-menu { display: flex; flex-wrap: wrap; gap: .3rem; padding: .5rem 1rem; background: var(--bg-card); border-bottom: 1px solid var(--border-color); }
        .nav-item {
            padding: .35rem .7rem; border-radius: 40px; font-size: .7rem; font-weight: 600;
            text-decoration: none; color: var(--text-secondary); border: 1px solid transparent;
        }
        .nav-item:hover, .nav-item.active { background: #191D1B; color: #FBFBF7; }
        .wrap { max-width: 1100px; margin: 1rem auto; padding: 0 1rem 2rem; }
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 1rem 1.2rem; margin-bottom: 1rem;
        }
        .card h2 { font-size: 1rem; margin-bottom: .8rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .6rem; }
        label { font-size: .65rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: .2rem; }
        input, select {
            width: 100%; padding: .45rem .55rem; border-radius: 8px; border: 1px solid var(--border-color);
            background: transparent; color: var(--text-primary); font-family: inherit; font-size: .8rem;
        }
        table { width: 100%; border-collapse: collapse; font-size: .75rem; margin-top: .6rem; }
        th { text-align: left; background: var(--verde-oliva); color: #fff; padding: .4rem .5rem; }
        td { padding: .4rem .5rem; border-bottom: 1px solid var(--border-color); }
        .btn {
            padding: .4rem .85rem; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-body); cursor: pointer; font-size: .75rem; font-family: inherit; font-weight: 600;
        }
        .btn-primary { background: #191D1B; color: #fff; border-color: #191D1B; }
        .btn-success { background: #2E7D32; color: #fff; border-color: #2E7D32; }
        .actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .8rem; }
        .toast {
            position: fixed; bottom: 1.2rem; right: 1.2rem; padding: .6rem 1rem; border-radius: 8px;
            background: #191D1B; color: #fff; font-size: .8rem; z-index: 9999; display: none;
        }
        .toast.show { display: block; }
        .hint { font-size: .7rem; color: var(--text-secondary); margin-top: .4rem; }
    </style>
</head>
<body>
<div class="app-topbar">
    <a class="logo" href="index.html">Taguá<span>Life</span></a>
    <span style="margin-left:auto;font-size:.7rem;"><strong id="usuarioLogado">—</strong> · <span id="cargoLogado">—</span></span>
    <div id="userMenuMount"></div>
</div>
<div class="nav-menu">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i> Dashboard</a>
    <a class="nav-item" href="estoque.html"><i class="fas fa-boxes"></i> Estoque</a>
    <a class="nav-item" href="saida.html"><i class="fas fa-arrow-right"></i> Saída</a>
    <a class="nav-item active" href="recebido.html"><i class="fas fa-clipboard-check"></i> Recebido</a>
    <a class="nav-item" href="mapacota.html"><i class="fas fa-file-invoice"></i> Cotação</a>
    <button class="nav-item" onclick="logout()" style="margin-left:auto;background:#8B3A3A;color:#fff;border:0;cursor:pointer;">Sair</button>
</div>

<div class="wrap">
    <div class="card">
        <h2><i class="fas fa-truck-loading"></i> Entrada de material (aumenta o estoque)</h2>
        <p class="hint">Registre o recebimento. Itens cadastrados no estoque terão a quantidade <strong>somada automaticamente</strong>.</p>
        <div class="grid" style="margin-top:.8rem;">
            <div>
                <label>Fornecedor *</label>
                <input type="text" id="recFornecedor" placeholder="Nome do fornecedor" />
            </div>
            <div>
                <label>Nota fiscal *</label>
                <input type="text" id="recNF" placeholder="Nº da NF" />
            </div>
            <div>
                <label>Recebido por</label>
                <input type="text" id="recPor" />
            </div>
            <div>
                <label>Data</label>
                <input type="date" id="recData" />
            </div>
        </div>
        <div style="margin-top:.8rem;">
            <label>Observação</label>
            <input type="text" id="recObs" placeholder="Opcional" />
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width:90px;">Qtd</th>
                    <th>Item (estoque)</th>
                    <th style="width:50px;"></th>
                </tr>
            </thead>
            <tbody id="recItensBody"></tbody>
        </table>
        <div class="actions">
            <button type="button" class="btn" onclick="addLinhaRec()"><i class="fas fa-plus"></i> Item</button>
            <button type="button" class="btn btn-success" id="btnSalvarRec" onclick="salvarRecebimento()">
                <i class="fas fa-save"></i> Salvar e entrar no estoque
            </button>
            <a class="btn" href="estoque.html">Ir ao Estoque</a>
        </div>
    </div>

    <div class="card">
        <h2><i class="fas fa-history"></i> Últimos recebimentos</h2>
        <div id="listaRec" class="hint">Carregando...</div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://frlecudymdpnrsilavbj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Uv-GZdW4peH3IZTIwiNYXg_IrYytpn4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.sb = sb;

let estoqueCache = [];

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
}

async function carregarEstoque() {
    let q = sb.from('estoque').select('id,nome,quantidade').order('nome');
    if (typeof comCondominio === 'function') q = comCondominio(q);
    const { data, error } = await q;
    if (error) console.warn(error);
    estoqueCache = data || [];
    document.querySelectorAll('.rec-item-select').forEach(fillSelect);
}

function fillSelect(sel) {
    const cur = sel.value;
    sel.innerHTML = '<option value="">Selecione...</option>' +
        estoqueCache.map(i => '<option value="' + i.id + '" data-nome="' + String(i.nome).replace(/"/g, '&quot;') + '">' +
            i.nome + ' (atual: ' + (i.quantidade || 0) + ')</option>').join('');
    if (cur) sel.value = cur;
}

function addLinhaRec() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><input type="number" class="rec-qtd" min="1" value="1" /></td>
        <td><select class="rec-item-select" style="width:100%"></select></td>
        <td><button type="button" class="btn" onclick="this.closest('tr').remove()" style="padding:.2rem .4rem;color:#8B3A3A;">✕</button></td>
    `;
    document.getElementById('recItensBody').appendChild(tr);
    fillSelect(tr.querySelector('select'));
}

async function salvarRecebimento() {
    const fornecedor = document.getElementById('recFornecedor').value.trim();
    const nf = document.getElementById('recNF').value.trim();
    const recebidoPor = document.getElementById('recPor').value.trim() || (getSessao() && getSessao().nome) || 'Sistema';
    const dataRec = document.getElementById('recData').value || new Date().toISOString().slice(0, 10);
    const obs = document.getElementById('recObs').value.trim();

    if (!fornecedor || !nf) {
        toast('⚠️ Fornecedor e NF são obrigatórios');
        return;
    }

    const rows = [...document.querySelectorAll('#recItensBody tr')];
    const itens = [];
    for (const tr of rows) {
        const qtd = parseInt(tr.querySelector('.rec-qtd').value) || 0;
        const sel = tr.querySelector('.rec-item-select');
        const id = sel.value;
        const nome = sel.selectedOptions[0] ? (sel.selectedOptions[0].getAttribute('data-nome') || sel.selectedOptions[0].textContent) : '';
        if (id && qtd > 0) itens.push({ id, nome, qtd });
    }
    if (!itens.length) {
        toast('⚠️ Adicione pelo menos um item');
        return;
    }

    const btn = document.getElementById('btnSalvarRec');
    btn.disabled = true;
    try {
        let payload = {
            fornecedor, nota_fiscal: nf, recebido_por: recebidoPor,
            data_recebimento: dataRec, observacao: obs || null, status: 'Recebido'
        };
        if (typeof payloadComCondominio === 'function') payload = payloadComCondominio(payload);

        let recId = null;
        try {
            const { data: rec, error } = await sb.from('recebimentos').insert(payload).select('id').single();
            if (error) throw error;
            recId = rec.id;
            const itensRows = itens.map(i => ({
                recebimento_id: recId,
                descricao: i.nome,
                quantidade: i.qtd
            }));
            await sb.from('recebimento_itens').insert(itensRows);
        } catch (e) {
            console.warn('recebimentos table:', e);
            // continua mesmo se tabela não existir — ainda entra estoque
        }

        // ENTRADA NO ESTOQUE
        let usuario = (getSessao() && (getSessao().nome || getSessao().email)) || '';
        for (const item of itens) {
            const reg = estoqueCache.find(e => e.id === item.id);
            const antes = reg ? (parseInt(reg.quantidade) || 0) : 0;
            const depois = antes + item.qtd;
            const { error } = await sb.from('estoque').update({
                quantidade: depois,
                atualizado_em: new Date().toISOString()
            }).eq('id', item.id);
            if (error) throw error;

            try {
                let mov = {
                    estoque_id: item.id,
                    item_nome: item.nome,
                    tipo: 'entrada',
                    quantidade: item.qtd,
                    quantidade_antes: antes,
                    quantidade_depois: depois,
                    usuario: usuario,
                    observacao: 'Recebimento NF ' + nf + (fornecedor ? ' — ' + fornecedor : ''),
                    referencia: recId
                };
                if (typeof payloadComCondominio === 'function') mov = payloadComCondominio(mov);
                await sb.from('estoque_movimentacoes').insert(mov);
            } catch (e) { console.warn('mov', e); }
        }

        toast('✅ Recebimento salvo e estoque atualizado!');
        document.getElementById('recFornecedor').value = '';
        document.getElementById('recNF').value = '';
        document.getElementById('recObs').value = '';
        document.getElementById('recItensBody').innerHTML = '';
        addLinhaRec();
        await carregarEstoque();
        await listarRecebimentos();
    } catch (e) {
        console.error(e);
        toast('❌ ' + (e.message || e));
    } finally {
        btn.disabled = false;
    }
}

async function listarRecebimentos() {
    const box = document.getElementById('listaRec');
    try {
        let q = sb.from('recebimentos').select('id,fornecedor,nota_fiscal,data_recebimento,recebido_por,criado_em')
            .order('criado_em', { ascending: false }).limit(20);
        if (typeof comCondominio === 'function') q = comCondominio(q);
        const { data, error } = await q;
        if (error) throw error;
        if (!data || !data.length) {
            box.innerHTML = 'Nenhum recebimento registrado ainda (ou tabela ainda não criada). As entradas no estoque funcionam mesmo assim.';
            return;
        }
        box.innerHTML = '<table><thead><tr><th>Data</th><th>Fornecedor</th><th>NF</th><th>Por</th></tr></thead><tbody>' +
            data.map(r => '<tr><td>' + (r.data_recebimento || r.criado_em || '').toString().slice(0, 10) + '</td><td>' +
                (r.fornecedor || '') + '</td><td>' + (r.nota_fiscal || '') + '</td><td>' + (r.recebido_por || '') +
                '</td></tr>').join('') + '</tbody></table>';
    } catch (e) {
        box.innerHTML = 'Histórico indisponível (crie a tabela recebimentos no Supabase se quiser o log). Entrada no estoque já funciona.';
    }
}

document.addEventListener('DOMContentLoaded', async function () {
    if (typeof mostrarUsuarioLogado === 'function') mostrarUsuarioLogado();
    const s = typeof getSessao === 'function' ? getSessao() : null;
    if (s) {
        document.getElementById('recPor').value = s.nome || '';
    }
    document.getElementById('recData').value = new Date().toISOString().slice(0, 10);
    await carregarEstoque();
    addLinhaRec();
    await listarRecebimentos();
});
</script>
</body>
</html>
