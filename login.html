<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaguáLife Center · Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <style>
        /* ===== ESTILOS ===== */
        :root {
            --verde-claro: #C1CE83;
            --verde-oliva: #7A816E;
            --branco: #FBFBF7;
            --preto: #191D1B;
            --bg-body: #E8EBE0;
            --bg-card: var(--branco);
            --text-primary: var(--preto);
            --text-secondary: var(--verde-oliva);
            --border-color: #D8DCCE;
            --shadow-hover: 0 6px 32px rgba(25, 29, 27, 0.15);
            --font-primary: 'Inter', sans-serif;
            --input-bg: transparent;
            --input-border: var(--border-color);
            --danger: #8B3A3A;
            --success: #2E7D32;
            --warning: #C1A83C;
        }

        body.dark-mode {
            --bg-body: #1a1a1a;
            --bg-card: #2a2a2a;
            --text-primary: #e8e8e8;
            --text-secondary: #b0b8a8;
            --border-color: #444;
            --input-bg: #333;
            --input-border: #555;
            --preto: #e8e8e8;
            --branco: #2a2a2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-primary);
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            padding: 1rem;
            transition: background 0.3s;
        }

        .login-container { width: 100%; max-width: 420px; }
        .login-card {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-hover);
            overflow: hidden;
            border: 1px solid var(--border-color);
            padding: 2rem 1.8rem;
            transition: background 0.3s, border-color 0.3s;
        }

        .login-header { text-align: center; margin-bottom: 1.8rem; }
        .login-header .logo-icon {
            width: 70px; height: 70px;
            background: var(--preto);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--verde-claro);
            font-weight: 800;
            font-size: 1.4rem;
            flex-direction: column;
            line-height: 1;
            padding: 0.3rem;
            margin-bottom: 0.8rem;
        }
        .login-header .logo-icon small { font-size: 0.45rem; color: var(--branco); font-weight: 400; }
        .login-header h1 { font-size: 1.4rem; font-weight: 800; }
        .login-header h1 .life { color: var(--verde-claro); }
        .login-header p { font-size: 0.75rem; color: var(--text-secondary); }

        .login-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--bg-body);
            border-radius: 10px;
            padding: 0.3rem;
            border: 1px solid var(--border-color);
        }
        .login-tabs .tab-btn {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: inherit;
            background: transparent;
            color: var(--text-secondary);
            transition: 0.3s;
        }
        .login-tabs .tab-btn.active {
            background: var(--preto);
            color: var(--branco);
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }
        .form-group label i { margin-right: 0.3rem; color: var(--verde-claro); }
        .form-group input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: none;
            border-bottom: 2px solid var(--input-border);
            background: var(--input-bg);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            outline: none;
            font-family: inherit;
            transition: 0.2s;
        }
        .form-group input:focus { border-bottom-color: var(--verde-claro); }

        .btn-login {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            background: var(--preto);
            color: var(--branco);
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .btn-login:hover { background: #2A3A2A; transform: translateY(-2px); }

        .message {
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            font-size: 0.75rem;
            margin-bottom: 1rem;
            display: none;
        }
        .message.error { display: block; background: rgba(139,58,58,0.1); color: var(--danger); }
        .message.success { display: block; background: rgba(46,125,50,0.1); color: var(--success); }
        .message.warning { display: block; background: rgba(193,168,60,0.1); color: #A89232; }

        .login-footer { text-align: center; margin-top: 1.2rem; font-size: 0.7rem; color: var(--text-secondary); }
        .login-footer a { color: var(--verde-oliva); cursor: pointer; text-decoration: none; font-weight: 600; }

        .theme-toggle {
            position: fixed; top: 1rem; right: 1rem;
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 40px; padding: 0.3rem 0.8rem;
            color: var(--text-secondary); cursor: pointer;
            font-size: 0.65rem; font-family: inherit;
            transition: 0.3s; display: flex; align-items: center; gap: 0.3rem;
            z-index: 100;
        }
        .theme-toggle:hover { border-color: var(--verde-claro); }

        .info-sistema {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            font-size: 0.55rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .info-sistema span { display: flex; align-items: center; gap: 0.3rem; }
        .info-sistema i { color: var(--verde-claro); }

        .versao-sistema {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.5rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">
    <i class="fas fa-moon" id="themeIcon"></i>
    <span id="themeLabel">Tema</span>
</button>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">T <small>LIFE</small></div>
            <h1>Taguá<span class="life">Life</span></h1>
            <p>Life Conceito em Gestão Condominial</p>
        </div>

        <div class="login-tabs">
            <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
            <button class="tab-btn" data-tab="register" onclick="switchTab('register')">
                <i class="fas fa-user-plus"></i> Registrar
            </button>
        </div>

        <div class="message" id="message"></div>

        <!-- FORM LOGIN -->
        <form id="formLogin" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label><i class="fas fa-user"></i> E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Senha</label>
                <input type="password" id="loginPassword" placeholder="Digite sua senha" required />
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-arrow-right"></i> Entrar</button>
        </form>

        <!-- FORM REGISTRO -->
        <form id="formRegister" onsubmit="handleRegister(event)" style="display:none;">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Nome Completo</label>
                <input type="text" id="regNome" placeholder="Seu nome completo" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> E-mail</label>
                <input type="email" id="regEmail" placeholder="seu@email.com" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Senha</label>
                <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirmar Senha</label>
                <input type="password" id="regConfirmPassword" placeholder="Confirme sua senha" required />
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-user-plus"></i> Criar Conta</button>
        </form>

        <div class="info-sistema">
            <span><i class="fas fa-shield-alt"></i> Seguro</span>
            <span><i class="fas fa-database"></i> Supabase</span>
            <span><i class="fas fa-clock"></i> <span id="horaSistema"></span></span>
        </div>

        <div class="versao-sistema">TaguáLife Center v2.0</div>

        <div class="login-footer">
            <span id="footerText">Já tem uma conta? <a onclick="switchTab('login')">Faça login</a></span>
        </div>
    </div>
</div>

<!-- ============================================ -->
<!-- BIBLIOTECA SUPABASE + CÓDIGO PRINCIPAL       -->
<!-- ============================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ============================================
    // CONEXÃO COM SUPABASE
    // ============================================
    const SUPABASE_URL = 'https://frlecudymdpnrsilavbj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Uv-GZdW4peH3IZTIwiNYXg_IrYytpn4';
    
    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('🔌 Conectado ao Supabase!');

    // ============================================
    // FUNÇÃO DE LOGIN (CORRIGIDA)
    // ============================================
    async function handleLogin(event) {
        event.preventDefault();
        console.log('🔄 Tentando login...');
        
        const email = document.getElementById('loginEmail').value.trim();
        const senha = document.getElementById('loginPassword').value;
        const message = document.getElementById('message');

        // Limpar mensagem anterior
        message.textContent = '';
        message.className = 'message';
        message.style.display = 'none';

        if (!email || !senha) {
            message.textContent = '⚠️ Preencha todos os campos!';
            message.className = 'message warning';
            message.style.display = 'block';
            return false;
        }

        try {
            console.log('📧 Buscando usuário:', email);
            
            const { data: usuario, error } = await supabase
                .from('usuarios')
                .select('*')
                .eq('email', email)
                .eq('senha_hash', senha)
                .maybeSingle();

            if (error) {
                console.error('❌ Erro na consulta:', error);
                message.textContent = '❌ Erro ao buscar usuário!';
                message.className = 'message error';
                message.style.display = 'block';
                return false;
            }

            if (!usuario) {
                console.log('❌ Usuário não encontrado');
                message.textContent = '❌ E-mail ou senha incorretos!';
                message.className = 'message error';
                message.style.display = 'block';
                return false;
            }

            console.log('✅ Usuário encontrado:', usuario.nome);

            // Salvar sessão
            localStorage.setItem('tagualife_sessao', JSON.stringify({
                id: usuario.id,
                email: usuario.email,
                nome: usuario.nome,
                cargo: usuario.cargo
            }));

            console.log('✅ Sessão salva!');

            message.textContent = '✅ Login realizado com sucesso!';
            message.className = 'message success';
            message.style.display = 'block';

            // Redirecionar para o dashboard
            console.log('🔄 Redirecionando para index.html...');
            window.location.href = 'index.html';

        } catch (err) {
            console.error('❌ Erro no login:', err);
            message.textContent = '❌ Erro ao fazer login!';
            message.className = 'message error';
            message.style.display = 'block';
        }

        return false;
    }

    // ============================================
    // FUNÇÃO DE REGISTRO (CORRIGIDA)
    // ============================================
    async function handleRegister(event) {
        event.preventDefault();
        console.log('🔄 Tentando registrar...');
        
        const nome = document.getElementById('regNome').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const senha = document.getElementById('regPassword').value;
        const confirmSenha = document.getElementById('regConfirmPassword').value;
        const message = document.getElementById('message');

        // Limpar mensagem anterior
        message.textContent = '';
        message.className = 'message';
        message.style.display = 'none';

        if (!nome || !email || !senha || !confirmSenha) {
            message.textContent = '⚠️ Preencha todos os campos!';
            message.className = 'message warning';
            message.style.display = 'block';
            return false;
        }

        if (senha.length < 6) {
            message.textContent = '⚠️ A senha deve ter pelo menos 6 caracteres!';
            message.className = 'message warning';
            message.style.display = 'block';
            return false;
        }

        if (senha !== confirmSenha) {
            message.textContent = '⚠️ As senhas não coincidem!';
            message.className = 'message warning';
            message.style.display = 'block';
            return false;
        }

        try {
            // Verificar se o e-mail já existe
            const { data: existingUser, error: checkError } = await supabase
                .from('usuarios')
                .select('email')
                .eq('email', email)
                .maybeSingle();

            if (existingUser) {
                message.textContent = '❌ Este e-mail já está cadastrado!';
                message.className = 'message error';
                message.style.display = 'block';
                return false;
            }

            // Inserir novo usuário
            const { data: newUser, error: insertError } = await supabase
                .from('usuarios')
                .insert({
                    nome: nome,
                    email: email,
                    senha_hash: senha,
                    cargo: 'Usuário',
                    ativo: true
                })
                .select();

            if (insertError) {
                console.error('❌ Erro no insert:', insertError);
                message.textContent = '❌ Erro ao cadastrar: ' + insertError.message;
                message.className = 'message error';
                message.style.display = 'block';
                return false;
            }

            console.log('✅ Usuário criado:', email);

            message.textContent = '✅ Conta criada com sucesso! Faça login.';
            message.className = 'message success';
            message.style.display = 'block';

            // Limpar formulário
            document.getElementById('regNome').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regConfirmPassword').value = '';

            // Mudar para a aba de login
            setTimeout(() => {
                switchTab('login');
                document.getElementById('loginEmail').value = email;
                document.getElementById('loginPassword').focus();
            }, 1500);

        } catch (err) {
            console.error('❌ Erro no registro:', err);
            message.textContent = '❌ Erro ao criar conta!';
            message.className = 'message error';
            message.style.display = 'block';
        }

        return false;
    }

    // ============================================
    // FUNÇÕES DE UI
    // ============================================
    function switchTab(tab) {
        console.log('🔄 Mudando para:', tab);
        const loginForm = document.getElementById('formLogin');
        const registerForm = document.getElementById('formRegister');
        const tabs = document.querySelectorAll('.tab-btn');
        const footer = document.getElementById('footerText');

        if (tab === 'login') {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
            footer.innerHTML = 'Já tem uma conta? <a onclick="switchTab(\'login\')">Faça login</a>';
        } else {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
            footer.innerHTML = 'Já tem uma conta? <a onclick="switchTab(\'login\')">Faça login</a>';
        }
    }

    function verificarSessao() {
        const sessao = JSON.parse(localStorage.getItem('tagualife_sessao') || 'null');
        if (sessao) {
            console.log('👤 Sessão ativa, redirecionando para index.html');
            window.location.href = 'index.html';
        }
    }

    // ============================================
    // TEMA
    // ============================================
    function toggleTheme() {
        const body = document.body;
        body.classList.toggle('dark-mode');
        const isDark = body.classList.contains('dark-mode');
        localStorage.setItem('tema_TaguáLife', isDark ? 'dark' : 'light');
        const icon = document.getElementById('themeIcon');
        const label = document.getElementById('themeLabel');
        if (isDark) { icon.className = 'fas fa-sun'; label.textContent = 'Claro'; } 
        else { icon.className = 'fas fa-moon'; label.textContent = 'Tema'; }
    }

    function carregarTema() {
        const theme = localStorage.getItem('tema_TaguáLife');
        if (theme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').className = 'fas fa-sun';
            document.getElementById('themeLabel').textContent = 'Claro';
        }
    }

    // ============================================
    // RELÓGIO
    // ============================================
    function atualizarHora() {
        const agora = new Date();
        const hora = agora.toLocaleTimeString('pt-BR', { 
            timeZone: 'America/Sao_Paulo',
            hour: '2-digit',
            minute: '2-digit'
        });
        document.getElementById('horaSistema').textContent = hora;
    }

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Página de login carregada!');
        carregarTema();
        atualizarHora();
        setInterval(atualizarHora, 1000);
        verificarSessao();

        console.log('🔐 Sistema TaguáLife Center v2.0');
        console.log('📧 Usuários padrão:');
        console.log('   admin@tagualife.com.br / admin123');
        console.log('   ednaldo@tagualife.com.br / 123456');
        console.log('   sindica@tagualife.com.br / sindica123');
    });
</script>

</body>
</html>
