<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaguáLife Center · Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --verde-claro: #C1CE83;
            --verde-oliva: #7A816E;
            --branco: #FBFBF7;
            --preto: #191D1B;
            --bg-body: #E8EBE0;
            --bg-card: #FBFBF7;
            --text-primary: #191D1B;
            --text-secondary: #7A816E;
            --border-color: #D8DCCE;
            --danger: #8B3A3A;
            --success: #2E7D32;
            --warning: #C1A83C;
        }
        body.dark-mode {
            --bg-body: #1a1a1a;
            --bg-card: #2a2a2a;
            --text-primary: #e8e8e8;
            --text-secondary: #b0b8a8;
            --border-color: #444;
            --preto: #e8e8e8;
            --branco: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            padding: 1rem;
            transition: background 0.3s;
        }
        .login-container { width: 100%; max-width: 420px; }
        .login-card {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 6px 32px rgba(25,29,27,0.15);
            border: 1px solid var(--border-color);
            padding: 2rem 1.8rem;
        }
        .login-header { text-align: center; margin-bottom: 1.5rem; }
        .logo-icon {
            width: 70px; height: 70px;
            background: #191D1B;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--verde-claro);
            font-weight: 800;
            font-size: 1.4rem;
            flex-direction: column;
            margin-bottom: 0.8rem;
        }
        .logo-icon small { font-size: 0.45rem; color: #FBFBF7; }
        .login-header h1 { font-size: 1.4rem; font-weight: 800; }
        .login-header h1 .life { color: var(--verde-claro); }
        .login-header p { font-size: 0.75rem; color: var(--text-secondary); }

        .login-tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.4rem;
            background: var(--bg-body);
            border-radius: 10px;
            padding: 0.3rem;
            border: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 0.55rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
            background: transparent;
            color: var(--text-secondary);
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #191D1B;
            color: #FBFBF7;
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }
        .form-group label i { margin-right: 0.3rem; color: var(--verde-claro); }
        .form-group input {
            width: 100%;
            padding: 0.65rem 0.8rem;
            border: none;
            border-bottom: 2px solid var(--border-color);
            background: transparent;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            outline: none;
            font-family: inherit;
        }
        .form-group input:focus { border-bottom-color: var(--verde-claro); }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            background: #191D1B;
            color: #FBFBF7;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .btn-login:hover { background: #2A3A2A; transform: translateY(-2px); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .message {
            padding: 0.65rem 0.9rem;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
        .message.show { display: block; }
        .message.error { background: rgba(139,58,58,0.12); color: var(--danger); }
        .message.success { background: rgba(46,125,50,0.12); color: var(--success); }
        .message.warning { background: rgba(193,168,60,0.12); color: #A89232; }

        .login-footer {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .login-footer a {
            color: var(--verde-oliva);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 0.35rem 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.7rem;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            z-index: 100;
        }

        .info-sistema {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 1.2rem;
            font-size: 0.6rem;
            color: var(--text-secondary);
        }
        .info-sistema i { color: var(--verde-claro); margin-right: 0.2rem; }

        .versao-sistema {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.55rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">
    <i class="fas fa-moon" id="themeIcon"></i>
    <span id="themeLabel">Tema</span>
</button>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">T <small>LIFE</small></div>
            <h1>Taguá<span class="life">Life</span></h1>
            <p>Life Conceito em Gestão Condominial</p>
        </div>

        <div class="login-tabs">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
            <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">
                <i class="fas fa-user-plus"></i> Registrar
            </button>
        </div>

        <div class="message" id="message"></div>

        <!-- FORM LOGIN -->
        <form id="formLogin">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Senha</label>
                <input type="password" id="loginPassword" placeholder="Digite sua senha" required />
            </div>
            <button type="submit" class="btn-login" id="btnLogin">
                <i class="fas fa-arrow-right"></i> Entrar
            </button>
        </form>

        <!-- FORM REGISTRO -->
        <form id="formRegister" style="display:none;">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Nome Completo</label>
                <input type="text" id="regNome" placeholder="Seu nome completo" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> E-mail</label>
                <input type="email" id="regEmail" placeholder="seu@email.com" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Senha</label>
                <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirmar Senha</label>
                <input type="password" id="regConfirmPassword" placeholder="Confirme sua senha" required />
            </div>
            <button type="submit" class="btn-login" id="btnRegister">
                <i class="fas fa-user-plus"></i> Criar Conta
            </button>
        </form>

        <div class="info-sistema">
            <span><i class="fas fa-shield-alt"></i> Seguro</span>
            <span><i class="fas fa-database"></i> Supabase</span>
            <span><i class="fas fa-clock"></i> <span id="horaSistema"></span></span>
        </div>
        <div class="versao-sistema">TaguáLife Center v2.0</div>

        <div class="login-footer">
            <span id="footerText">Não tem conta? <a onclick="switchTab('register')">Registre-se</a></span>
        </div>
    </div>
</div>

<script>
    // ============================================
    // SUPABASE - CORREÇÃO PRINCIPAL
    // ============================================
    const SUPABASE_URL = 'https://frlecudymdpnrsilavbj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Uv-GZdW4peH3IZTIwiNYXg_IrYytpn4';

    // Forma correta de criar o cliente
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('✅ Supabase conectado');

    // ============================================
    // UI
    // ============================================
    function mostrarMensagem(texto, tipo) {
        const el = document.getElementById('message');
        el.textContent = texto;
        el.className = 'message show ' + tipo;
    }

    function limparMensagem() {
        document.getElementById('message').className = 'message';
    }

    function switchTab(tab) {
        const formLogin = document.getElementById('formLogin');
        const formRegister = document.getElementById('formRegister');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const footer = document.getElementById('footerText');

        limparMensagem();

        if (tab === 'login') {
            formLogin.style.display = 'block';
            formRegister.style.display = 'none';
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            footer.innerHTML = 'Não tem conta? <a onclick="switchTab(\'register\')">Registre-se</a>';
        } else {
            formLogin.style.display = 'none';
            formRegister.style.display = 'block';
            tabLogin.classList.remove('active');
            tabRegister.classList.add('active');
            footer.innerHTML = 'Já tem conta? <a onclick="switchTab(\'login\')">Faça login</a>';
        }
    }

    // ============================================
    // LOGIN
    // ============================================
    document.getElementById('formLogin').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('loginEmail').value.trim().toLowerCase();
        const senha = document.getElementById('loginPassword').value;
        const btn = document.getElementById('btnLogin');

        if (!email || !senha) {
            mostrarMensagem('⚠️ Preencha todos os campos!', 'warning');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';
        limparMensagem();

        try {
            const { data: usuario, error } = await supabase
                .from('usuarios')
                .select('*')
                .eq('email', email)
                .eq('senha_hash', senha)
                .maybeSingle();

            if (error) {
                console.error(error);
                mostrarMensagem('❌ Erro de conexão com o banco. Verifique o RLS.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right"></i> Entrar';
                return;
            }

            if (!usuario) {
                mostrarMensagem('❌ E-mail ou senha incorretos!', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right"></i> Entrar';
                return;
            }

            if (usuario.ativo === false) {
                mostrarMensagem('❌ Usuário desativado.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right"></i> Entrar';
                return;
            }

            // Salva sessão
            localStorage.setItem('tagualife_sessao', JSON.stringify({
                id: usuario.id,
                nome: usuario.nome,
                email: usuario.email,
                cargo: usuario.cargo || 'Usuário'
            }));

            mostrarMensagem('✅ Login realizado! Redirecionando...', 'success');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);

        } catch (err) {
            console.error(err);
            mostrarMensagem('❌ Erro inesperado.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-arrow-right"></i> Entrar';
        }
    });

    // ============================================
    // REGISTRO
    // ============================================
    document.getElementById('formRegister').addEventListener('submit', async function(e) {
        e.preventDefault();

        const nome = document.getElementById('regNome').value.trim();
        const email = document.getElementById('regEmail').value.trim().toLowerCase();
        const senha = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirmPassword').value;
        const btn = document.getElementById('btnRegister');

        if (!nome || !email || !senha || !confirm) {
            mostrarMensagem('⚠️ Preencha todos os campos!', 'warning');
            return;
        }
        if (senha.length < 6) {
            mostrarMensagem('⚠️ Senha deve ter no mínimo 6 caracteres!', 'warning');
            return;
        }
        if (senha !== confirm) {
            mostrarMensagem('⚠️ As senhas não coincidem!', 'warning');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando...';
        limparMensagem();

        try {
            // Verifica se e-mail já existe
            const { data: existe } = await supabase
                .from('usuarios')
                .select('id')
                .eq('email', email)
                .maybeSingle();

            if (existe) {
                mostrarMensagem('❌ Este e-mail já está cadastrado!', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Criar Conta';
                return;
            }

            const { error } = await supabase
                .from('usuarios')
                .insert({
                    nome: nome,
                    email: email,
                    senha_hash: senha,
                    cargo: 'Usuário',
                    ativo: true
                });

            if (error) {
                console.error(error);
                mostrarMensagem('❌ Erro ao cadastrar: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Criar Conta';
                return;
            }

            mostrarMensagem('✅ Conta criada! Agora faça login.', 'success');

            setTimeout(() => {
                switchTab('login');
                document.getElementById('loginEmail').value = email;
                document.getElementById('loginPassword').focus();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Criar Conta';
            }, 1200);

        } catch (err) {
            console.error(err);
            mostrarMensagem('❌ Erro inesperado.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-user-plus"></i> Criar Conta';
        }
    });

    // ============================================
    // TEMA + RELÓGIO
    // ============================================
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('tema_TaguáLife', isDark ? 'dark' : 'light');
        document.getElementById('themeIcon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        document.getElementById('themeLabel').textContent = isDark ? 'Claro' : 'Tema';
    }

    function carregarTema() {
        if (localStorage.getItem('tema_TaguáLife') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').className = 'fas fa-sun';
            document.getElementById('themeLabel').textContent = 'Claro';
        }
    }

    function atualizarHora() {
        const hora = new Date().toLocaleTimeString('pt-BR', {
            timeZone: 'America/Sao_Paulo',
            hour: '2-digit',
            minute: '2-digit'
        });
        document.getElementById('horaSistema').textContent = hora;
    }

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        carregarTema();
        atualizarHora();
        setInterval(atualizarHora, 1000);

        // Se já estiver logado, redireciona
        const sessao = localStorage.getItem('tagualife_sessao');
        if (sessao) {
            window.location.href = 'index.html';
        }

        console.log('🚀 Login TaguáLife carregado e pronto');
    });
</script>
</body>
</html>
