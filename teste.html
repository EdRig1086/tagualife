<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Supabase</title>
</head>
<body>
    <h1>Teste Supabase</h1>
    <button onclick="testarConexao()">Testar Conexão</button>
    <button onclick="listarDados()">Listar Dados</button>
    <button onclick="salvarDado()">Salvar Dado</button>
    <pre id="resultado">Aguardando ação...</pre>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script>
        // CONFIGURAÇÃO
        const SUPABASE_URL = 'https://frlecudymdpnrsilavbj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Uv-GZdW4peH3IZTIwiNYXg_IrYytpn4';
        
        console.log('🔵 Inicializando Supabase...');
        console.log('URL:', SUPABASE_URL);
        console.log('KEY:', SUPABASE_KEY.substring(0, 20) + '...');
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Supabase criado!');
        
        function mostrar(texto) {
            document.getElementById('resultado').textContent = texto;
            console.log(texto);
        }

        async function testarConexao() {
            try {
                mostrar('🔄 Testando conexão...');
                
                // Teste simples
                const { data, error } = await supabase
                    .from('cotacoes')
                    .select('count', { count: 'exact', head: true });
                
                if (error) {
                    throw error;
                }
                
                mostrar('✅ Conexão OK! Tabela existe!');
                
            } catch (error) {
                console.error('❌ Erro:', error);
                mostrar('❌ ERRO: ' + error.message + '\n\nVerifique o Console (F12) para mais detalhes.');
            }
        }

        async function listarDados() {
            try {
                mostrar('🔄 Carregando dados...');
                
                const { data, error } = await supabase
                    .from('cotacoes')
                    .select('*')
                    .limit(5);
                
                if (error) throw error;
                
                if (data.length === 0) {
                    mostrar('📭 Nenhum registro encontrado.');
                } else {
                    let texto = '📋 Registros encontrados:\n\n';
                    data.forEach((item, i) => {
                        texto += `${i+1}. ${item.nome || 'Sem nome'} - ${item.uso || 'Sem uso'}\n`;
                        texto += `   ID: ${item.id.substring(0, 8)}\n`;
                        texto += `   Data: ${new Date(item.criado_em).toLocaleString('pt-BR')}\n\n`;
                    });
                    mostrar(texto);
                }
                
            } catch (error) {
                console.error('❌ Erro:', error);
                mostrar('❌ ERRO: ' + error.message);
            }
        }

        async function salvarDado() {
            try {
                mostrar('🔄 Salvando...');
                
                const dado = {
                    nome: 'Teste ' + new Date().toLocaleTimeString(),
                    uso: 'Teste Rápido',
                    status: 'rascunho',
                    melhor_valor: 0
                };
                
                const { data, error } = await supabase
                    .from('cotacoes')
                    .insert([dado])
                    .select();
                
                if (error) throw error;
                
                mostrar('✅ Salvo com sucesso!\nID: ' + data[0].id);
                
            } catch (error) {
                console.error('❌ Erro:', error);
                mostrar('❌ ERRO: ' + error.message);
            }
        }

        // Executar ao carregar
        console.log('🚀 Página pronta!');
        mostrar('🟢 Clique em "Testar Conexão" para começar.');
        
        // Verificar se o Supabase foi carregado
        if (typeof supabase === 'undefined') {
            mostrar('❌ Supabase não foi carregado! Verifique sua conexão com a internet.');
        } else {
            console.log('✅ Supabase carregado com sucesso!');
        }
    </script>
</body>
</html>
