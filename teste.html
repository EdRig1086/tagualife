<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste Mínimo</title>
</head>
<body>
    <h1>Teste JavaScript</h1>
    <button onclick="testar()">Clique aqui</button>
    <p id="resultado"></p>

    <script>
        function testar() {
            document.getElementById('resultado').innerHTML = '✅ JavaScript está funcionando!';
            console.log('✅ JavaScript funcionou!');
        }
        
        console.log('✅ Página carregada!');
        alert('✅ A página carregou! Clique em OK para continuar.');
    </script>
</body>
</html>
