<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaguáLife Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #E8EBE0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        h1 { 
            color: #191D1B; 
            font-size: 2rem;
            margin-bottom: 10px;
        }
        h1 span { color: #C1CE83; }
        p { color: #7A816E; margin: 10px 0; }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #191D1B;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #2A3A2A;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Taguá<span>Life</span></h1>
        <p>Sistema de Gestão Condominial</p>
        <a href="login.html" class="btn">Acessar o Sistema</a>
        <p style="font-size: 0.7rem; color: #999; margin-top: 20px;">
            Versão 2.0 • Life Conceito em Gestão Condominial
        </p>
    </div>
</body>
</html>
